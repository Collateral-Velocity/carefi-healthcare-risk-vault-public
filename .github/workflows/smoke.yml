name: Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m py_compile app.py vault_engine.py historical_replay.py live_data.py ingest_production.py oriel_event_marks.py
      - name: Unit tests
        run: PYTHONPATH=. python -m pytest -q
      - name: Compile Solidity contracts
        run: |
          mkdir -p /tmp/solc-out
          npx --yes solc@0.8.24 --bin --base-path . --include-path . contracts/CAREHRV01ShareSuite.sol -o /tmp/solc-out
          test -n "$(find /tmp/solc-out -name '*.bin' -type f -size +0c -print -quit)"
      - name: Launch Streamlit and verify health
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health > /dev/null; then
              echo "Streamlit health check passed"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/streamlit.log
          exit 1

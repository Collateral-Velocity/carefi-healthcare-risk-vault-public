name: Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m py_compile app.py vault_engine.py historical_replay.py live_data.py ingest_production.py
      - name: Unit tests
        run: PYTHONPATH=. python -m pytest -q
